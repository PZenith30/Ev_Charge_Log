<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    ไอคอน KiloEV — Next.js เสิร์ฟไฟล์นี้เป็น favicon ให้เอง พร้อมต่อ ?hash ท้าย URL
    พอไฟล์เปลี่ยน URL ก็เปลี่ยน เบราว์เซอร์จึงโหลดรูปใหม่โดยไม่ต้องล้างแคช

    คำอธิบายต้องอยู่ "ข้างใน" แท็ก svg เท่านั้น ห้ามวางไว้ก่อน
    เพราะ Next อ่านขนาดรูปด้วย image-size ซึ่งมองหา <svg ในช่วง 1000 ไบต์แรก
    คอมเมนต์ภาษาไทยกินไบต์ละ 3 ตัวอักษร ดันแท็กเลย 1000 ไบต์เมื่อไหร่ build พังทันที

    รูปเดียวอ่านได้สามอย่าง
      ขาซ้าย  = ขาของทั้ง K และ L ใช้ร่วมกัน
      สายฟ้า  = จรดขาเป็นก้อนเดียวแล้วแยกเป็นสองแฉกปลายแหลม
                สองแฉกนี้ทำหน้าที่เป็นแขนบน-แขนล่างของ K ไปพร้อมกัน
      ฐานล่าง = บางและสั้น แค่บอกใบ้ตัว L ไม่ให้แย่งสายตา
    พิกัดชุดเดียวกับ doc/make-icons.js รูปจึงตรงกันทุกที่
  -->
  <rect width="32" height="32" rx="8" fill="#111827"/>
  <path fill="#22c55e" d="M6.2 5h4.8v23H6.2zM6.2 25.2h8.4V28H6.2zM10.6 9.3 26 3.3l-11.4 9.8 11.8 12.8-15.8-6.6z"/>
</svg>
